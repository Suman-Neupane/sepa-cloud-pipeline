name: SEPA Cloud-Native CI/CD Pipeline (AWS Emulator + Terraform + DevSecOps)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  AWS_ENDPOINT_URL: https://127.0.0.1:9297
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: eu-central-1
  AWS_VERIFY_SSL: "false"

jobs:
  # ============================================================================
  # JOB 1: Shift-Left Code Quality, Unit Tests & Terraform IaC Security Scan
  # ============================================================================
  code-quality-and-secops:
    name: "1. Lint, Unit Tests & Trivy IaC Security"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: ruff check src/ tests/

      - name: Run Fast Unit Tests (SEPA IBAN, 19% MwSt & AML Rules)
        run: pytest tests/test_unit_validator.py -v

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format & Syntax Check
        working-directory: ./terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Run Trivy IaC Security Scanner on Terraform
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "./terraform"
          exit-code: "1"
          severity: "HIGH,CRITICAL"

  # ============================================================================
  # JOB 2: Ephemeral AWS Emulator Provisioning & End-to-End Integration Suite
  # ============================================================================
  ephemeral-aws-emulator-e2e:
    name: "2. Ephemeral AWS Emulator (:9297) + Terraform + E2E Pytest"
    runs-on: ubuntu-latest
    needs: code-quality-and-secops
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build & Start Official AWS Emulator Container (Port 9297)
        run: |
          docker build --build-arg TARGETARCH=amd64 -t aws-emulator -f docker/emulator.Dockerfile .
          docker run -d --name aws-emulator \
            --memory=2g --memory-swap=2g \
            -p 127.0.0.1:9297:9297 \
            aws-emulator -p 9297 -a off
          for i in {1..30}; do
            if curl -k -s https://127.0.0.1:9297/__admin/health | grep -q "ok"; then
              echo "AWS Emulator is healthy!"
              break
            fi
            echo "Waiting for AWS Emulator..."
            sleep 1
          done
          docker ps

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Provision AWS Architecture on AWS Emulator via Terraform
        working-directory: ./terraform
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run End-to-End Integration & Chaos DLQ Tests against AWS Emulator
        run: pytest tests/test_integration_aws.py -v
